name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Trusted Publishing (tokenless OIDC) requires Node >=22.14.0 and npm >=11.5.1.
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@latest && npm --version
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            BEGIN { inblock = 0 }
            /^## \[/ {
              if (inblock) exit
              if ($0 ~ "\\["ver"\\]") { inblock = 1; next }
            }
            inblock { print }
          ' CHANGELOG.md > release-notes.md
          {
            echo "notes<<EOF"
            cat release-notes.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Trusted Publishing: tokenless OIDC. Requires the package to be configured
      # as a Trusted Publisher on npmjs.com (repo: drakulavich/oura-cli,
      # workflow: release.yml, allowed action: npm publish). No NPM_TOKEN needed.
      - name: Publish to npm
        run: npm publish --access public --provenance

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" -R "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi
