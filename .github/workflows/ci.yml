name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read   # required for actions/checkout
  id-token: write  # required for GitHub OIDC → flakiness.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Type-check
        run: bunx tsgo --noEmit

      - name: Run tests
        run: |
          mkdir -p test-results
          bun test --reporter=junit --reporter-outfile=test-results/junit.xml

      - name: Convert JUnit to Flakiness Report
        if: always()
        run: |
          curl -LsSf https://cli.flakiness.io/install.sh | sh
          flakiness convert-junit test-results/junit.xml --category bun --project drakulavich/oura-cli

      - name: Upload to Flakiness.io
        if: always()
        continue-on-error: true  # flakiness.io project may not exist yet
        run: flakiness upload ./flakiness-report

      - name: Build
        run: bun run build

      - name: npm audit (high+)
        run: |
          if command -v npm >/dev/null; then
            npm audit --audit-level=high --omit=dev || echo "::warning::npm audit found issues"
          fi
