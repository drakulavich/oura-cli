name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Type-check
        run: bunx tsgo --noEmit

      - name: Test + flakiness report
        run: bun run tools/flakiness/run.ts
        env:
          FLAKINESS_PROJECT: drakulavich/oura-cli
          FLAKINESS_ACCESS_TOKEN: ${{ secrets.FLAKINESS_ACCESS_TOKEN }}

      - name: Upload flakiness report artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: flakiness-report
          path: flakiness-report/
          retention-days: 30

      - name: Build
        run: bun run build

      - name: npm audit (high+)
        run: |
          if command -v npm >/dev/null; then
            npm audit --audit-level=high --omit=dev || echo "::warning::npm audit found issues"
          fi
